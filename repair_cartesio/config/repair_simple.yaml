solver_options:
    regularization: 1e-2
    back_end: qpoases

stack:
  - [tcp_1, tcp_2, torso]

constraints:
  - jlim
  - vlim

jlim:
  type: JointLimits
  limits:
    # arm_joint_3: [0, 0]

vlim:
  type: VelocityLimits
  limits: 3.0

tcp_1:
  type: Cartesian
  lambda: 0.1
  distal_link: arm_1_tcp
  base_link: torso_1
  use_local_subtasks: true

tcp_2:
  type: Cartesian
  lambda: 0.1
  distal_link: arm_2_tcp
  base_link: torso_1
  use_local_subtasks: true

torso:
  type: Cartesian
  lambda: 0.1
  distal_link: torso_1
  use_local_subtasks: true

tcp_pos:
  type: Subtask
  task: tcp
  indices: [0, 1, 2]

tcp_rot:
  type: Subtask
  task: tcp
  indices: [4, 5]

postural:
  type: Postural
  lambda: 0.1
