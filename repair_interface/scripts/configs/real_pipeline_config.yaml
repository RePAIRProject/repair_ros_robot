use_both_hands: False #Indicates if bimanula manipulation should be used
use_hands: True #Indicates if QB hands should be used at all (Per default True)
grasp_without_rotation: False # Indicates if we use oriented bounding box from recognition framework to align hand
place_without_rotation: False
follow_the_hand: False # it will choose placement side based on the hand and not on the published data
use_klampt: True #uses Klampt instead of Moveit
single_step_execution: False #If true, robot will wait for user input before each movement

min_z_value_arm_1: 1.137 # Minimum Z value the Left (big hand) arm is alowed to go down to
min_z_value_arm_2: 1.076 # Minimum Z value the Right (small hand) arm is alowed to go down to
  
fresco_pose_world_x_offset: 0.05 # 0.05 # -0.04 # 
fresco_pose_world_y_offset: 0.08 # -0.06 #  # Offset in Y direction for correct Hand placement above Fresco fragment (we still don't know why we need it)

fresco_pose_world_z: 1.29 # Initial Z Heigt for placing Hand above Fresco Fragment
fresco_down_pose_y_offset: 0.04 # Hardcoded Y offset to better grasp fresco when going down to it
grasp_z_above_fresco_in_meters_qb: 0.03
grasp_z_above_fresco_in_meters_wide: 0.055

placement_center_table_x: 0.15 # Placing offset to not collide with other already placed frescos
placement_center_table_y: 0.65 # Placing offset to not collide with other already placed frescos

lift_position_z_offset_after_grasp: 0.16 # intermediate position after grasping to go to, to test if grasp was succesfull

dropping_position_z_arm_1: 1.13 # Z height at which the hand opens to drop the fresco
dropping_position_z_arm_2: 1.1  

qbHand_current_thresh: -1000 # 550 # current threshold to check if fresco was properly grasped
qbHand_current_thresh2: -1000 # 300 # current threshold to check if fresco was properly grasped
wideHand_current_thresh: -1000 # 120 # current threshold to check if fresco was properly grasped
fresco_area_threshold_for_rotation: 5000  # Area threshold to decide if we need to rotate the hand when grasping fresco in pixels^2
max_grasp_attempts: 3 # Maximum number of attempts to grasp the fresco  

# LEGACY
use_pyrealsense: False #Legacy, indicates if pyrealsense library should be used
use_fragment_alignment: False #Legacy, indicates if hand sould be aligned fresco bounding box
hardcoded_placement: False #Legacy, indicates if we use hardcoded placing position for fresco